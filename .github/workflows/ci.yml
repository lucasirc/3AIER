name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de teste
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Rodar testes
        run: python -m pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empacotar código
        run: |
          mkdir -p dist
          zip -r dist/agente.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".venv/*" \
            -x "**/__pycache__/*" \
            -x ".env" \
            -x "*.pyc"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: agente-build
          path: dist/agente.zip
